name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r product/server/requirements.txt
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest product/server/ -q
      - run: python3 kb/pipeline/scripts/validate_schema.py

  firmware:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect firmware-record changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" \
              | grep -E '^(kb/output/(extracted/firmware-genome|firmware-genome|packs/[^/]+/firmware)/)' \
              > /dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.skip == 'false'
        with:
          python-version: "3.13"
      - name: Install firmware toolchains
        if: steps.changed.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compile-check firmware records
        if: steps.changed.outputs.skip == 'false'
        run: |
          pip install -r product/server/requirements.txt
          python3 kb/pipeline/scripts/firmware_validator.py
