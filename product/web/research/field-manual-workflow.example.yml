name: Field Manual MVP
on:
  push:
    paths: ['product/web/**', '.github/workflows/field-manual.yml']
  pull_request:
    paths: ['product/web/**', '.github/workflows/field-manual.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
        working-directory: product/web
      - run: python3 scripts/check_static.py
        working-directory: product/web
